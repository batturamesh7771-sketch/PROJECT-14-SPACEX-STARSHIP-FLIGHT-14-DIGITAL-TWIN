# Phase 5 Configuration: Uncertainty Quantification & Monte Carlo Dispersions
# Classification: SYNTHETIC_SCENARIO
config_id: "P5-CFG-004-UNCERTAINTY"
scenario_name: "orbital_insertion_uncertainty_quantification"
description: "Statistical dispersion and sensitivity analysis over insertion velocity, position, and mass."
epoch_utc: "2026-09-28T14:08:42.350Z"
reference_frame: "ECI_J2000"

monte_carlo:
  sample_count: 100
  random_seed: 42
  propagation_duration_seconds: 5400.0 # 1 full revolution
  output_summary_only: true

uncertainty_distributions:
  position_sigma_m: 50.0 # 1-sigma uncertainty in ECI position
  velocity_sigma_m_s: 1.5 # 1-sigma uncertainty in cutoff velocity vector
  mass_sigma_kg: 2500.0   # 1-sigma uncertainty in burnout mass (residual propellant)
  drag_coefficient_sigma: 0.15 # 1-sigma aerodynamic drag uncertainty

baseline_state:
  x_m: 967660.5
  y_m: -5900231.6
  z_m: 2617085.1
  vx_m_s: 7698.6
  vy_m_s: 678.7
  vz_m_s: -1311.5
  mass_kg: 220850.0

propagation:
  integrator: "DOP853"
  rtol: 1.0e-7
  atol: 1.0e-9
  max_step_seconds: 60.0
